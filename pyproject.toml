[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schauburg-schedule"
version = "0.1.0"
description = "List original-language screenings at Karlsruhe's Schauburg"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.12", "platformdirs>=4", "requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
schauburg-schedule = "schauburg_schedule.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
schauburg_schedule = ["assets/*.ico"]
