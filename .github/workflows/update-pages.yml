name: Update GitHub Pages

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/update-pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Generate schedule page
        run: python -m schauburg_schedule --html --output site/index.html --days 8 --no-cache --snapshot-dir snapshots
      - name: Verify generated page
        run: |
          test -s site/index.html
          wc -c site/index.html
      - name: Persist cinema snapshots
        run: |
          shopt -s nullglob
          files=(snapshots/*.json)
          ((${#files[@]})) || exit 0
          git add "${files[@]}"
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update cinema snapshots [skip ci]"
          branch="${{ github.event.repository.default_branch }}"
          if ! git pull --rebase origin "$branch"; then
            git rebase --abort || true
            echo "Warning: could not rebase snapshot commit; deploying current page without persistence."
            exit 0
          fi
          git push origin HEAD:"$branch" || echo "Warning: could not push snapshots; deploying current page without persistence."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
